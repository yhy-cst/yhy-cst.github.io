# ─────────────────────────────────────────────────────────────
#  左侧栏底部的社交图标
#  想加更多图标：https://tabler-icons.io/  取名字填到 icon 即可
# ─────────────────────────────────────────────────────────────

[[social]]
    identifier = "github"
    name       = "GitHub"
    url        = "https://github.com/yhy-cst"

    [social.params]
        icon = "brand-github"

# 想显示邮箱就把下面这几行的注释去掉，并改成你的真实邮箱。
# 注意别留着示例地址，否则访客点了会发到不存在的地方。
# [[social]]
#     identifier = "mail"
#     name       = "Email"
#     url        = "mailto:you@example.com"
#
#     [social.params]
#         icon = "messages"

[[social]]
    identifier = "rss"
    name       = "RSS"
    url        = "index.xml"

    [social.params]
        icon = "rss"
